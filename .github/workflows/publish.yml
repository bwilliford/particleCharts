name: Publish to npm

# Releases are cut by pushing a version tag:
#
#   npm version minor && git push --follow-tags
#
# `npm version` syncs src/index.js, rebuilds dist and tags the commit, so the
# tag always points at the exact tree that gets published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the job mints an OIDC token that npm verifies
  # to attest which repo, workflow and commit produced the tarball. Publishing
  # from a laptop cannot do this, which is why a local `npm publish` fails with
  # `provider: null` while publishConfig.provenance is true.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      # `prepublishOnly` already runs build + test, but doing it here means a
      # failure is reported as its own step rather than buried in publish logs.
      - run: npm run build
      - run: npm test

      # Guard against a tag that disagrees with package.json — publishing
      # v0.2.0 from a tree that says 0.3.0 would be silently wrong.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
