name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # dist/ is committed so the demo and the CDN work straight from a clone.
      # If a source change lands without a rebuild, that is a bug — catch it here.
      - name: dist/ is up to date with src/
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale — run 'npm run build' and commit the result" && exit 1)
